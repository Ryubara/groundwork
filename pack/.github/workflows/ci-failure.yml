# A red run on the default branch is everyone's problem at once: it opens one P-critical issue naming the workflow and
# the run, or comments on the open one for that workflow, so a broken default branch is never only a red dot.
# List the workflows to watch under `workflows:`; they must be the `name:` of each workflow file.
name: ci-failure

on:
  workflow_run:
    workflows: [ci, conventions]
    types: [completed]

permissions:
  issues: write

jobs:
  report:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    steps:
      - name: Open or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.event.workflow_run.name }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          title="CI failing on the default branch: $WORKFLOW"
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number,title \
            --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          text="The \`$WORKFLOW\` workflow failed on ${SHA:0:10}: $RUN_URL"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$text"
          else
            gh issue create --title "$title" --label task --label P-critical --label S-ready-to-start \
              --body "$text. Fix it forward before anything else merges; close this issue when the workflow is green."
          fi
