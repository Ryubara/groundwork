# The rules for running this repository: commits, pull requests, issues, labels, merging and hygiene. This file is the
# one source of truth for every rule a program can check. .github/scripts/groundwork.py reads it and refuses an
# unknown key or a wrong type. The pull request template and the issue forms are generated from it
# (`groundwork.py render`), the labels, merge settings and branch ruleset are applied from it (`labels`, `settings`,
# `ruleset`), and `groundwork.py check` reports any drift. Change a rule here, then render and apply.
# YAML traps: quote a colour made only of digits ("000000") and any text YAML could read as a number or a boolean.
version: 1

repo:
  default_branch: main
  # What an issue or a pull request calls the person who directs the project.
  wording: {person: user, avoid: [owner]}
  # Decisions only a maintainer makes: an agent stops and reports instead of acting.
  maintainer_decisions:
    - make the repository public
    - tag a release
    - force-push the default branch or someone else's branch
    - legal or licence questions
    - change these conventions

paths:
  # A change under `code` needs a change under `docs` (the living doc moves with the code) or a `Docs: none` line.
  code: ["src/"]
  docs: ["docs/", "README.md", "CHANGELOG.md"]
  # Files that only point at another, so every agent tool reads one set of instructions (`check-files`).
  pointer_files: {files: [CLAUDE.md, GEMINI.md], content: "@AGENTS.md", max_bytes: 400}
  # Hand-written files with generated blocks (`<!-- conventions:begin NAME -->` ... `<!-- conventions:end -->`):
  # `render` rewrites each block from this file and `render --check` fails on a hand edit. Names: commit-rules,
  # maintainer-decisions, manual-paths.
  blocks_in: [AGENTS.md, CONTRIBUTING.md]
  # The largest file a commit may add, in KB; the pre-commit large-file hook uses the same number.
  large_file_kb: 512

commits:
  title:
    form: "area: Verb the rest"
    max_length: 72
    trailing_period: false
    breaking_suffix: "(BREAKING)"
    areas:
      build: "build files, dependencies and toolchain setup"
      ci: "GitHub Actions workflows and repository settings"
      core: "the project's main code"
      tests: "test-only changes"
      docs: "README, guides and other documentation"
      agents: "agent instructions (AGENTS.md, CLAUDE.md)"
    verbs: [Add, Fix, Update, Remove, Rebuild, Rework, Improve, Document]
  # Checked on every commit of a pull request (`check-commits`): the one trailer is an AI co-author with the vendor's
  # noreply address, and no other e-mail address appears, so nobody's address is published by a commit.
  trailers:
    ai_co_author:
      key: "Co-Authored-By"
      value: "<model name> <noreply address>"
      noreply: ["noreply@anthropic.com", "noreply@google.com", "noreply@openai.com"]
    only_ai_co_author: true
    other_emails: false

pull_requests:
  template: .github/pull_request_template.md
  # `##` headings of the description, in the template's order; the squash commit takes the pull request's title.
  sections: [Summary, Issues affected, Checklist, Testing, Screenshots, AI use]
  filled: [Summary, Testing]                     # must hold text of their own, not just a comment or a placeholder
  placeholders: ["...", "<reason>"]              # template text that counts as empty when left unchanged
  local_paths: false                             # no scratch/, ../../ or C:\ in the text (images are the exception)
  docs_none: {line: "Docs: none", when_changed: code, unless_changed: docs}
  closing: {keyword: "Fixes", form: "Fixes #N", one_per_line: true, section: Summary}
  # Every task a pull request lists is finished: an unticked `- [ ]` item is refused. Work it does not finish lives in
  # its own issue.
  checklist: {section: Checklist, unchecked: refused}
  # A pull request whose title area is in `areas` (the areas a person sees: UI, art, levels) shows what changed: an
  # uploaded image or video in this section (`gh pr create|edit --attach`), or the `none` line with a reason in
  # parentheses. Empty `areas`: the rule is off. The check needs the title: `check-body --title`.
  # before_after: the section holds a `Before:` and an `After:` capture, each uploaded; `Before: none (reason)` when the
  # thing is new. The `none` line with a reason still covers a pull request with nothing visible.
  screenshots:
    section: Screenshots
    none: "Screenshots: none"
    areas: []
    before_after: {before: "Before:", after: "After:"}
  # Every other open issue the change partly fixes, changes or makes out of date, one `#N: how` line each, or one line
  # `None (reason)`. An issue the change finishes is a `Fixes #N` line in Summary instead. After the merge the
  # coordinator updates each issue listed.
  issues_affected: {section: Issues affected, none: "None"}
  # A pull request whose title verb is listed (a fix) shows a test failing before the change and passing after it: a
  # `Failed first:` line in Testing, or `Failed first: none (reason)` when no test can show it. Needs `check-body --title`.
  failed_first: {verbs: [Fix], section: Testing, label: "Failed first:"}
  ai_use:
    section: "AI use"
    written_by:
      label: "Commits written by:"
      choices: ["a person", "an AI", "an AI, edited by a person", "a person, with AI help"]
      no_ai: "a person"
    # names_trailer_models: the model line must name every model a commit's co-author trailer names.
    model: {label: "Model:", none: "n/a", names_trailer_models: true}
  guidance:
    Summary: "One short paragraph: what this changes and why. If the change needs no documentation, add a line `Docs: none`. If this finishes an issue, add a line `Fixes #<number>` (one per issue)."
    "Issues affected": "Every other open issue this partly fixes, changes or makes out of date, one line each: `- #123: its step 2 is done`. An issue this finishes is `Fixes #N` in Summary, not here. None affected: one line `None (reason)`, such as `None (one-line fix)`. After the merge the coordinator updates each issue listed."
    Checklist: "List what this pull request finishes, each item ticked. Work it does not finish is not listed here: it lives in its own issue."
    Testing: "What was run and what came out: commands, tests added or changed, results as counts or pass/fail. A `Fix` pull request adds `Failed first:` with the test that failed before the fix and passes after (or `Failed first: none (reason)`); otherwise delete that line."
    Screenshots: "Captures of what changed, before and after the change (attach them: gh pr create --attach). Something new: `Before: none (new)`. Nothing visible changed: replace both lines with `Screenshots: none (reason)`."
    "AI use": "Who wrote the work in this pull request's commits, not who opened the pull request."

merge:
  # Mirrors the GitHub ruleset and the repository settings (`groundwork.py ruleset`, `settings`).
  methods: [squash]
  squash_title: PR_TITLE
  squash_message: PR_BODY                        # the description, so its Co-Authored-By trailers stay
  auto_merge: true
  delete_branch_on_merge: true
  linear_history: true
  required_checks: [title, body, docs, commits]
  # A pull request that changes one of these is merged by a maintainer by hand: tools and agent hooks refuse to turn
  # on auto-merge for it (`needs-maintainer`). The rules that judge agents are changed only by a person.
  manual_paths: [.github/conventions.yml, AGENTS.md, .claude/settings.json, .claude/hooks/]

issues:
  blank_issues: false
  placeholders: ["x", "xx", "xxx", "tbd", "todo", "wip", "...", "n/a", "na", "?"]
  forms:
    bug:
      name: Bug
      description: Something is broken
      file: .github/ISSUE_TEMPLATE/bug.yml
      title_prefix: "Bug: "
      labels: [bug, S-needs-triage]
      sections:
        version: ["Version or commit", true]
        steps: ["Steps to reproduce", true]
        expected: ["What you expected", true]
        actual: ["What happens", true]
        log: ["Log", false]
    task:
      name: Task
      description: A piece of work for a maintainer or an agent
      file: .github/ISSUE_TEMPLATE/task.yml
      title_prefix: "Task: "
      labels: [task, S-needs-triage]
      intro: "A task is written so that someone with no other context can do it: start with the problem."
      sections:
        from:
          heading: From
          type: input
          required: true
          description: "Who filed it and when, and the pull request or issue it came from (say whether that is merged)."
          placeholder: "From: the coordinator, 2026-11-01, review of #12 (merged)"
        summary: ["Summary", true]
        area:
          heading: Area
          type: dropdown
          options_from: title_areas
          required: true
          description: "The part of the project; the matching A- label is applied from it."
        docs-page:
          heading: Docs page
          type: input
          description: "The page (and section) that covers this, as a link, or `none yet`."
          placeholder: "docs/design/thing.md#section"
        done:
          heading: What "done" means
          required: true
          description: "The acceptance test. For a bug fix: a test that fails before the fix and passes after it."
        steps: ["Fix list or steps", false]
        blocked-by: ["Blocked by", false]
  # How many of each label family an open issue carries.
  labels:
    type: exactly-one
    status: exactly-one

labels:
  description_max: 100                           # GitHub's limit
  # A label belongs to the family named by its prefix; `type` has no prefix and lists its names.
  families:
    type: {prefix: "", names: [bug, task, docs, enhancement]}
    priority: {prefix: "P-"}
    status: {prefix: "S-"}
    # One `A-<area>` label per title area, generated (not listed below); the task form's Area dropdown offers them and
    # the issue-area workflow applies the one chosen.
    area: {prefix: "A-", from_title_areas: true, color: c5def5}
  list:
    - {name: bug, color: d73a4a, description: "Something is broken"}
    - {name: task, color: 0e8a16, description: "A piece of work for a maintainer or an agent"}
    - {name: docs, color: 0075ca, description: "Documentation"}
    - {name: enhancement, color: a2eeef, description: "A new feature or an improvement"}
    - {name: P-critical, color: b60205, description: "Priority: the default branch is broken; drop everything"}
    - {name: P-high, color: e11d21, description: "Priority: blocks other work"}
    - {name: P-medium, color: fbca04, description: "Priority: next in line"}
    - {name: P-low, color: 0e8a16, description: "Priority: when there is room"}
    - {name: S-needs-triage, color: ededed, description: "Status: not yet looked at"}
    - {name: S-ready-to-start, color: 0e8a16, description: "Status: triaged and accepted; waiting for someone"}
    - {name: S-needs-info, color: d4c5f9, description: "Status: waiting for the reporter"}
    - {name: S-in-progress, color: 5319e7, description: "Status: someone is working on it"}
    - {name: S-pending-review, color: 1d76db, description: "Status: a pull request is open"}
    - {name: S-blocked, color: "000000", description: "Status: waiting for another issue or a decision"}
    - {name: good first issue, color: 7057ff, description: "Good for newcomers"}
    - {name: help wanted, color: "008672", description: "Extra attention is needed"}
    - {name: duplicate, color: cfd3d7, description: "This already exists"}
    - {name: wontfix, color: ffffff, description: "This will not be worked on"}

hygiene:
  report_issue:
    title: "Repo hygiene"
    labels: [task, P-low, S-in-progress]
  sweep: "0 6 * * 1"                             # weekly, Monday 06:00 UTC; must equal the cron in hygiene.yml
  thresholds:
    needs_triage_days: 7
    needs_info_days: 21
    in_progress_idle_days: 30
    pull_request_idle_days: 30
