# Groundwork's own checks: the checker's tests, and the pack's conventions file must load and render.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv run --no-project --with pyyaml --with pytest python -m pytest tests -q
      - name: The pack's conventions are valid and render
        run: |
          cp -r pack/.github "$RUNNER_TEMP/t"
          cd "$RUNNER_TEMP/t/.." && mv t .github
          uv run --no-project --with pyyaml python .github/scripts/groundwork.py validate
          uv run --no-project --with pyyaml python .github/scripts/groundwork.py render
          uv run --no-project --with pyyaml python .github/scripts/groundwork.py render --check
